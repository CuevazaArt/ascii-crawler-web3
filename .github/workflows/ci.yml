name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Legal · Score · Buttons · Live rails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24+: tests cover the operator API via built-in node:sqlite
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
